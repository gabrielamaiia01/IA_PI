version: "3.9"

services:
  db:
    image: postgres:15
    container_name: crime_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: crime_app
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data: