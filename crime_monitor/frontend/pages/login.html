<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        .logo-box {
    text-align: center;
    margin-bottom: 20px;
    margin-left: 30px;
}


        body{
            background: linear-gradient(to right, #007BFF, #c9d6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container{
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            width: 420px;
            padding: 40px 35px;
            text-align: center;
        }

        h1{
            margin-bottom: 20px;
            color: #007BFF;
        }

        .login-box{
            width: 100%;
        }

        input{
            background-color: #eee;
            border: none;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: 8px;
            width: 100%;
        }

        label{
            display: block;
            margin-top: 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        .captcha-box{
            display: flex;
            align-items: center;
            margin-top: 8px;
            gap: 10px;
        }

        .captcha-box img{
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        .captcha-refresh{
            background: #007BFF;
            color: #fff;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        button[type="submit"]{
            background: #007BFF;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
        }

        button[type="submit"]:hover{
            background: #0056d6;
        }

        .cadastro-link{
            margin-top: 15px;
            display: block;
            color: #007BFF;
            font-weight: 600;
            text-decoration: none;
        }

        .cadastro-link:hover{
            text-decoration: underline;
        }

        ul { margin-top: 10px; color: red; }
    </style>

</head>
<body>

        <div class="logo-box">
        <img src="../static/img/image-removebg-preview.png" alt="Logo Crime Monitor">
    </div>
<div class="container">

    <h1>Login Crime Monitor</h1>

    <div class="login-box">
        <form method="POST" action="/login">

            <input type="text" name="username" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>

            <label>Captcha:</label>
            <div class="captcha-box">
                <img id="captchaImage" src="{{ url_for('captcha') }}" alt="Captcha">
                <button type="button" class="captcha-refresh" onclick="refreshCaptcha()">🔄</button>
            </div>

            <input type="text" name="captcha" placeholder="Digite o captcha" maxlength="5" required>

            <button type="submit">Entrar</button>

            <a href="/cadastro" class="cadastro-link">Não tem conta? Cadastre-se</a>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul>
                  {% for msg in messages %}
                    <li>{{ msg }}</li>
                  {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}
        </form>
    </div>

</div>

<script>
function refreshCaptcha(){
    document.getElementById('captchaImage').src =
        "{{ url_for('captcha') }}" + "?" + new Date().getTime();
}
</script>

</body>
</html>
