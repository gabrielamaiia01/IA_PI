<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }


        body {
            background: #ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 20px;
            width: 98%;
            height: 98vh;
            padding: 3px 5px;
            text-align: center;
            justify-content: space-between;
            display: flex;
        }

        h1 {
            color: #000000;
            margin-right: 25%;
        }

        h3 {
            text-align: left;
            margin-right: 15px;
            color: #003366;
            margin-top: 8px;
        }

        p {

            text-align: center;
            margin-top: 20px;
            font-weight: medium;
        }


        .login-box,
        .logo-box {
            flex: 1;
        }

        .login-box {
            margin-top: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-box {
            display: flex;
            justify-content: center;
            background-color: #0059B3;
            border-radius: 25px;
        }

        .logo-box img {
            margin-top: 150px;
            width: 55%;
            height: 60%;

        }

        input {
            background-color: #ffff;
            margin: 8px 0;
            border: none;
            padding: 12px 15px;
            width: 100%;
            border-color: #003366;
            border-bottom-style: solid;
            border-bottom-width: initial;
            margin-top: 30px;
        }

        label {
            display: block;
            margin-top: 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            margin-top: 8px;
            gap: 10px;
        }

        .captcha-box img {
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        .captcha-refresh {
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        button[type="submit"] {
            background: #003366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
            box-shadow: 5px 3px 3px #00000043;
        }

        button[type="submit"]:hover {
            background: #0059B3;
        }

        .cadastro-link {

            color: #007BFF;
            font-weight: 600;
            text-decoration: none;
        }

        .cadastro-link:hover {
            text-decoration: underline;
        }

        ul {
            margin-top: 10px;
            color: red;
            list-style: none;
        }
        /* ============================
           MEDIA QUERIES RESPONSIVAS
        ============================ */

        /* Tablets grandes e desktops pequenos */
        @media (max-width: 768px) {
            .container{
                display: block !important;
            }
            .logo-box {
                margin-top: 20px;
                margin-bottom: 30px;
            }
            .login-box {
                margin-top: 10px;
            }
            input, 
            .captcha-refresh, 
            button[type="submit"] {
                padding: 10px 12px;
            }

        }

        /* Tablets pequenos e smartphones grandes */
        @media (max-width: 576px) {
            body {
                padding: 15px;
            }
            .logo-box img{
                width: 80%;
            }

            .container {
                max-width: 100%;
                padding: 30px 25px;
                border-radius: 15px;
            }

            .logo-box {
                margin-bottom: 15px;
            }
            h1 {
                margin-bottom: 15px;
            }

            input {
                margin: 6px 0;
                padding: 10px 12px;
            }

            .captcha-box {
                gap: 8px;
            }

            .captcha-refresh {
                padding: 8px 12px;
                font-size: 1.2rem;
            }

            button[type="submit"] {
                padding: 10px;
                margin-top: 12px;
            }

            .cadastro-link {
                margin-top: 12px;
            }
        }

        /* Smartphones pequenos */
        @media (max-width: 400px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px 20px;
                border-radius: 12px;
            }

            h1 {
                margin-bottom: 12px;
            }

            input {
                padding: 8px 10px;
            }

            .captcha-box {
                flex-direction: column;
                align-items: stretch;
            }

            .captcha-box img {
                width: 100%;
            }

            .captcha-refresh {
                width: 100%;
                padding: 10px;
            }

            button[type="submit"] {
                padding: 10px;
            }
        }

        /* Smartphones muito pequenos */
        @media (max-width: 320px) {
            .container {
                padding: 20px 15px;
            }

            input {
                padding: 8px;
                font-size: 0.875rem;
            }

            .captcha-refresh {
                font-size: 1rem;
            }
        }

        /* Orientação paisagem em dispositivos móveis */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                min-height: auto;
                padding: 10px;
            }

            .container {
                padding: 20px 25px;
            }

            h1 {
                margin-bottom: 10px;
                font-size: 1.5rem;
            }

            input {
                margin: 5px 0;
                padding: 8px 10px;
            }

            button[type="submit"] {
                margin-top: 10px;
                padding: 8px;
            }

            .cadastro-link {
                margin-top: 10px;
            }
        }

    </style>

</head>

<body>

    <div class="container">
        <div class="login-box">
            <h1>Fazer Login </br> </h1>
            <h3> Acesse o sistema preditivo de crimes</h3>

            <form method="POST" action="/login">



                <input type="text" name="username" placeholder="Insira seu usuário" required>

                <input type="password" name="password" placeholder="Insira sua senha" required>

                <label>Captcha:</label>
                <div class="captcha-box">
                    <img id="captchaImage" src="{{ url_for('captcha') }}" alt="Captcha">
                    <button type="button" class="captcha-refresh" onclick="refreshCaptcha()">🔄</button>
                </div>

                <input type="text" name="captcha" placeholder="Digite o captcha" maxlength="5" required>

                <button type="submit">Entrar</button>
                <p>Ainda não tem uma conta? </br>
                    <a href="/cadastro" class="cadastro-link">Crie uma aqui</a>.
                </p>


                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <ul>
                    {% for msg in messages %}
                    <li>{{ msg }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
                {% endwith %}
            </form>
        </div>


        <div class="logo-box">
            <img src="../static/img/image-removebg-preview.png" alt="Logo Crime Monitor">
        </div>
    </div>

    <script>
        function refreshCaptcha() {
            document.getElementById('captchaImage').src =
                "{{ url_for('captcha') }}" + "?" + new Date().getTime();
        }
    </script>

</body>

</html>
