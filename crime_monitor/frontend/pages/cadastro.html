<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Crime Monitor</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body{
            background: linear-gradient(to right, #007BFF, #c9d6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .register-container{
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            width: 420px;
            padding: 40px 35px;
            text-align: center;
        }

        h2{
            margin-bottom: 20px;
            color: #007BFF;
            font-weight: 700;
        }

        label{
            display: block;
            margin-top: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        input{
            background-color: #eee;
            border: none;
            margin: 8px 0 0 0;
            padding: 12px 15px;
            border-radius: 8px;
            width: 100%;
        }

        button[type="submit"]{
            background: #007BFF;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }

        button[type="submit"]:hover{
            background: #0056d6;
        }

        .login-link{
            margin-top: 15px;
        }

        .login-link a{
            color: #007BFF;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover{
            text-decoration: underline;
        }

        ul{
            margin-top: 10px;
            color: red;
            text-align: left;
        }
    </style>
</head>
<body>

        <div class="logo-box">
        <img src="../static/img/image-removebg-preview.png" alt="Logo Crime Monitor">
    </div>
<div class="register-container">

    <h2>Cadastro Crime Monitor</h2>

    <form method="POST" action="/cadastro">

        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" pattern="[A-Za-zÀ-ÿ\s]+" title="Apenas letras são permitidas" required>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Digite seu email" required>

        <label>Usuário:</label>
        <input type="text" name="username" placeholder="Escolha um usuário" required>

        <label>Senha:</label>
        <input type="password" name="password" placeholder="Digite sua senha" required>

        <label>Confirmar Senha:</label>
        <input type="password" name="confirm_password" placeholder="Repita sua senha" required>

        <button type="submit">Cadastrar</button>
    </form>

    <div class="login-link">
        Já tem uma conta? <a href="/login">Faça login</a>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

</div>

</body>
</html>
