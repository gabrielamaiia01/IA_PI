<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Monitor RJ</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
 
        .register-container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
        }
 
        .register-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
 
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
 
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
 
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #3763bc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
 
        button[type="submit"]:hover {
            background: #45a049;
        }
 
        .login-link {
            text-align: center;
            margin-top: 15px;
        }
 
        .login-link a {
            color: #3763bc;
            text-decoration: none;
        }
 
        .login-link a:hover {
            text-decoration: underline;
        }
 
        ul {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Cadastro - Monitor RJ</h2>
        <form method="POST" action="/cadastro">
            <label>Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" pattern="[A-Za-zÀ-ÿ\s]+" title="Apenas letras são permitidas" required>
 
            <label>Email:</label>
            <input type="email" name="email" placeholder="Digite seu email" required>
 
            <label>Usuário:</label>
            <input type="text" name="username" placeholder="Escolha um usuário" required>
 
            <label>Senha:</label>
            <input type="password" name="password" placeholder="Digite sua senha" required>
 
            <label>Confirmar Senha:</label>
            <input type="password" name="confirm_password" placeholder="Repita sua senha" required>
 
            <button type="submit">Cadastrar</button>
        </form>
 
        <div class="login-link">
            Já tem uma conta? <a href="/login">Faça login</a>
        </div>
 
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
              {% for msg in messages %}
                <li>{{ msg }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
